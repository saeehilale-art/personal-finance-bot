<!DOCTYPE html>
<html>
<head>
    <title>Add Income</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1>Add Monthly Income</h1>

    <form method="POST">

        <input type="text"
               name="source"
               placeholder="Income Source"
               required><br><br>

        <input type="number"
               name="amount"
               placeholder="Amount"
               required><br><br>

        <button class="btn">Save Income</button>

    </form>

</div>

</body>
</html>
